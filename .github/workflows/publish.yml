name: Publish coding-git-autocommit

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with current trusted-publishing support
        run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify committed build artifacts
        run: git diff --exit-code
      - name: Publish standalone package using OIDC
        run: npm run release:publish
